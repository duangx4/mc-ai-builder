<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MC AI Builder - 3D 预览</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: #1a1a2e; overflow: hidden; }
  #canvas-container { position: fixed; inset: 0; }

  /* 顶部栏 */
  #toolbar {
    position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 8px; z-index: 10;
    background: rgba(20,20,40,0.92); backdrop-filter: blur(10px);
    padding: 8px 16px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1);
  }
  #toolbar button, #file-label {
    padding: 8px 18px; border: none; border-radius: 8px;
    font-size: 13px; cursor: pointer; font-weight: 600;
    transition: all 0.2s; color: #fff;
  }
  #file-label { background: #4a6cf7; }
  #file-label:hover { background: #5b7df8; }
  #toolbar button { background: rgba(255,255,255,0.1); }
  #toolbar button:hover { background: rgba(255,255,255,0.2); }
  #toolbar button.active { background: #4a6cf7; }
  input[type="file"] { display: none; }

  /* 信息面板 */
  #info {
    position: fixed; bottom: 16px; left: 16px; z-index: 10;
    background: rgba(20,20,40,0.9); backdrop-filter: blur(10px);
    padding: 12px 16px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1);
    color: #ccc; font-size: 12px; line-height: 1.6;
    min-width: 200px;
  }
  #info .val { color: #7eb8ff; font-weight: 600; }

  /* 快捷键提示 */
  #help {
    position: fixed; bottom: 16px; right: 16px; z-index: 10;
    color: rgba(255,255,255,0.4); font-size: 11px;
  }

  /* 读取中 */
  #loading {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    z-index: 100; background: rgba(10,10,20,0.8); color: #fff; font-size: 18px;
    pointer-events: none; opacity: 0; transition: opacity 0.3s;
  }
  #loading.show { opacity: 1; }

  /* 图例 */
  #legend {
    position: fixed; top: 80px; right: 12px; z-index: 10;
    background: rgba(20,20,40,0.88); backdrop-filter: blur(10px);
    padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1);
    color: #aaa; font-size: 11px; max-height: 60vh; overflow-y: auto;
    display: none;
  }
  #legend .item { display: flex; align-items: center; gap: 6px; margin: 2px 0; }
  #legend .swatch { width: 12px; height: 12px; border-radius: 2px; flex-shrink: 0; }
</style>
</head>
<body>

<div id="canvas-container"></div>

<div id="toolbar">
  <label id="file-label" for="file-input">📂 加载 blocks.json</label>
  <input type="file" id="file-input" accept=".json">
  <button id="btn-reset" title="重置视角">🔄 重置</button>
  <button id="btn-top" title="俯视图">⬆ 俯视</button>
  <button id="btn-front" title="正面图">🏠 正面</button>
  <button id="btn-wire" title="线框模式">🔍 线框</button>
  <button id="btn-legend" title="图例">🎨 图例</button>
</div>

<div id="info">
  <div>📐 尺寸: <span class="val" id="info-size">-</span></div>
  <div>🧱 方块数: <span class="val" id="info-blocks">-</span></div>
  <div>🏷️ 类型数: <span class="val" id="info-types">-</span></div>
  <div>📦 分组: <span class="val" id="info-groups">-</span></div>
</div>

<div id="help">🖱 左键旋转 | 滚轮缩放 | 右键平移</div>
<div id="loading">⏳ 加载中...</div>
<div id="legend"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ===================== 颜色映射 =====================
const COLORS = {
  // 白色系
  white_concrete: 0xe8e8e8, white_concrete_powder: 0xf0f0f0, white_wool: 0xefefef,
  quartz_block: 0xf5f0e8, smooth_quartz: 0xf8f4ec, quartz_pillar: 0xf0ece4,
  // 灰色系
  stone: 0x7f7f7f, stone_bricks: 0x787878, cobblestone: 0x6e6e6e,
  mossy_stone_bricks: 0x6b7a5e, mossy_cobblestone: 0x5e6b4e,
  cracked_stone_bricks: 0x6a6a6a, chiseled_stone_bricks: 0x737373,
  smooth_stone_slab: 0x9e9e9e, stone_brick_slab: 0x787878,
  stone_brick_wall: 0x707070, polished_andesite: 0x8a8a8a,
  // 深色系
  deepslate_tiles: 0x3a3a42, deepslate_tile_stairs: 0x3a3a42,
  deepslate_tile_slab: 0x3a3a42, deepslate_bricks: 0x3e3e48,
  polished_deepslate: 0x404048, blackstone: 0x2a2a30,
  // 木色系
  oak_planks: 0xb8945c, oak_log: 0x9a7d4a, oak_stairs: 0xb8945c,
  oak_slab: 0xb8945c, oak_fence: 0xb08c50, oak_trapdoor: 0xb08848,
  spruce_planks: 0x8b5e3c, spruce_log: 0x6e4424, spruce_stairs: 0x8b5e3c,
  spruce_slab: 0x8b5e3c, spruce_fence: 0x805838, spruce_trapdoor: 0x7d5030,
  dark_oak_planks: 0x5c3a1e, dark_oak_log: 0x3a2210, dark_oak_stairs: 0x5c3a1e,
  dark_oak_slab: 0x5c3a1e, dark_oak_fence: 0x4a2e18,
  dark_oak_fence_gate: 0x4a2e18, dark_oak_trapdoor: 0x4e3018,
  dark_oak_door: 0x4a2e18, stripped_oak_log: 0xb89058,
  stripped_spruce_log: 0x8b5a30, stripped_birch_log: 0xd4c48c,
  birch_planks: 0xd4c48c,
  // 红/棕
  red_terracotta: 0x8e4432, brick: 0x994d33,
  // 玻璃
  glass: 0xc8e8f8, glass_pane: 0xc8e8f8,
  light_blue_stained_glass: 0xa8d8f8, white_stained_glass: 0xe8f0f8,
  // 水/植物
  water: 0x3355dd, grass_block: 0x7a9a3a, grass: 0x5a8a2a,
  fern: 0x4a7a1a, dandelion: 0xdddd00, poppy: 0xcc2222,
  azure_bluet: 0xaaaadd, bamboo: 0x6a8a2a, bamboo_sapling: 0x5a7a2a,
  sweet_berry_bush: 0x3a6a1a, leaves: 0x3a7a1a, vine: 0x3a6a1a,
  lily_pad: 0x2a8a2a, azalea_leaves: 0x4a8a2a,
  // 光源
  lantern: 0xffcc88, soul_lantern: 0x88ccff, glowstone: 0xddcc88,
  sea_lantern: 0xaaccdd, torch: 0xffcc44,
  // 其他
  hay_block: 0xaaaa44, barrel: 0x8b6e4a, end_rod: 0xe8e8e0,
  lightning_rod: 0xcc8844, chain: 0x555555,
  iron_bars: 0x888888, campfire: 0x664422,
};

// HSL→RGB 哈希给未知方块生成颜色
function hashColor(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = ((h << 5) - h + name.charCodeAt(i)) | 0;
  return new THREE.Color().setHSL((h & 0xff) / 256, 0.55, 0.55).getHex();
}

function getColor(blockType) {
  // 先精确匹配
  if (COLORS[blockType]) return COLORS[blockType];
  // 去掉属性部分 (e.g. "oak_door?facing=south" → "oak_door")
  const base = blockType.split('?')[0];
  if (COLORS[base]) return COLORS[base];
  // 模糊匹配：查找包含关系
  for (const [k, v] of Object.entries(COLORS)) {
    if (base.includes(k) || k.includes(base)) return v;
  }
  return hashColor(base);
}

// ===================== Three.js 场景 =====================
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a2e);
scene.fog = new THREE.Fog(0x1a1a2e, 60, 200);

const camera = new THREE.PerspectiveCamera(55, container.clientWidth / container.clientHeight, 0.5, 500);
camera.position.set(30, 25, 40);
camera.lookAt(15, 4, 15);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
container.appendChild(renderer.domElement);

// 灯光
const ambientLight = new THREE.AmbientLight(0x8899cc, 1.5);
scene.add(ambientLight);
const sunLight = new THREE.DirectionalLight(0xffeedd, 4.5);
sunLight.position.set(40, 50, 20);
sunLight.castShadow = true;
sunLight.shadow.mapSize.width = 2048;
sunLight.shadow.mapSize.height = 2048;
sunLight.shadow.camera.near = 0.5;
sunLight.shadow.camera.far = 200;
sunLight.shadow.camera.left = -60;
sunLight.shadow.camera.right = 60;
sunLight.shadow.camera.top = 60;
sunLight.shadow.camera.bottom = -60;
sunLight.shadow.bias = -0.0001;
scene.add(sunLight);
const fillLight = new THREE.DirectionalLight(0xaaccff, 1.2);
fillLight.position.set(-20, 10, -20);
scene.add(fillLight);

// 轨道控制
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(15, 4, 15);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 3;
controls.maxDistance = 120;
controls.maxPolarAngle = Math.PI * 0.85;
controls.update();

// 网格地面
const gridHelper = new THREE.PolarGridHelper(40, 40, 20, 256, 0x444466, 0x333350);
gridHelper.position.y = -1.01;
scene.add(gridHelper);

// ===================== 方块渲染 (InstancedMesh) =====================
const BLOCK_SIZE = 0.94;
const allInstancedMeshes = [];
const colorToBlocks = new Map();  // color → [{x,y,z}]
let wireframeMode = false;

// 共享几何体
const boxGeo = new THREE.BoxGeometry(BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);
const dummy = new THREE.Object3D();

function renderBlocks(blocks) {
  // 清除旧内容
  allInstancedMeshes.forEach(m => { scene.remove(m); m.dispose(); });
  allInstancedMeshes.length = 0;
  colorToBlocks.clear();

  const loadingEl = document.getElementById('loading');
  loadingEl.classList.add('show');
  loadingEl.textContent = `⏳ 正在渲染 ${blocks.length.toLocaleString()} 个方块...`;

  // 按颜色分组
  for (const b of blocks) {
    const [x, y, z] = b.position;
    const blockType = b.type || 'stone';
    const color = getColor(blockType);
    if (!colorToBlocks.has(color)) colorToBlocks.set(color, []);
    colorToBlocks.get(color).push({ x, y, z });
  }

  const colors = Array.from(colorToBlocks.keys());
  // 同步渲染所有颜色组（InstancedMesh 性能足够）
  for (const color of colors) {
    const positions = colorToBlocks.get(color);
    const count = positions.length;
    const mat = new THREE.MeshLambertMaterial({ color });
    const im = new THREE.InstancedMesh(boxGeo, mat, count);
    im.castShadow = true;
    im.receiveShadow = true;
    im.userData = { color, count };

    for (let j = 0; j < count; j++) {
      dummy.position.set(positions[j].x, positions[j].y, positions[j].z);
      dummy.updateMatrix();
      im.setMatrixAt(j, dummy.matrix);
    }
    im.instanceMatrix.needsUpdate = true;
    scene.add(im);
    allInstancedMeshes.push(im);
  }

  loadingEl.classList.remove('show');
  updateInfo(blocks);
}

// ===================== 信息面板 =====================
function updateInfo(blocks) {
  const xs = blocks.map(b => b.position[0]);
  const ys = blocks.map(b => b.position[1]);
  const zs = blocks.map(b => b.position[2]);
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  const minZ = Math.min(...zs), maxZ = Math.max(...zs);
  const types = new Set(blocks.map(b => b.type?.split('?')[0]));
  const groups = new Set(blocks.map(b => b.groupId));

  document.getElementById('info-size').textContent =
    `${maxX - minX + 1}×${maxZ - minZ + 1}×${maxY - minY + 1}  (${minX}..${maxX}, ${minY}..${maxY}, ${minZ}..${maxZ})`;
  document.getElementById('info-blocks').textContent = blocks.length.toLocaleString();
  document.getElementById('info-types').textContent = types.size;
  document.getElementById('info-groups').textContent = groups.size;

  // 自动调整相机目标
  const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2, cz = (minZ + maxZ) / 2;
  controls.target.set(cx, cy, cz);

  // 自动调整相机距离
  const span = Math.max(maxX - minX, maxZ - minZ, (maxY - minY) * 1.5);
  const dist = span * 1.5;
  camera.position.set(cx + dist * 0.6, cy + dist * 0.7, cz + dist * 0.8);
  controls.update();

  buildLegend(blocks);
}

// ===================== 图例 =====================
function buildLegend(blocks) {
  const typeCounts = {};
  for (const b of blocks) {
    const base = (b.type || 'unknown').split('?')[0];
    typeCounts[base] = (typeCounts[base] || 0) + 1;
  }
  const sorted = Object.entries(typeCounts).sort((a, b) => b[1] - a[1]).slice(0, 30);

  const legendEl = document.getElementById('legend');
  legendEl.innerHTML = '<b style="color:#ccc">方块图例 (Top 30)</b><br>' +
    sorted.map(([name, count]) => {
      const c = '#' + getColor(name).toString(16).padStart(6, '0');
      return `<div class="item"><span class="swatch" style="background:${c}"></span> ${name} <span style="color:#666">×${count}</span></div>`;
    }).join('');
}

// ===================== 文件加载 =====================
document.getElementById('file-input').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;

  const loadingEl = document.getElementById('loading');
  loadingEl.classList.add('show');
  loadingEl.textContent = '⏳ 读取文件中...';

  try {
    const text = await file.text();
    const data = JSON.parse(text);
    const blocks = Array.isArray(data) ? data : (data.blocks || data.data || []);

    if (blocks.length === 0) {
      alert('未找到方块数据。JSON 格式应为 [{position:[x,y,z], type:"block_id"}, ...]');
      loadingEl.classList.remove('show');
      return;
    }

    renderBlocks(blocks);
  } catch (err) {
    alert('解析 JSON 失败: ' + err.message);
    loadingEl.classList.remove('show');
  }
});

// ===================== 按钮事件 =====================
document.getElementById('btn-reset').addEventListener('click', () => {
  controls.target.set(15, 4, 15);
  camera.position.set(30, 25, 40);
  controls.update();
});

document.getElementById('btn-top').addEventListener('click', () => {
  const t = controls.target;
  camera.position.set(t.x, t.y + 40, t.z + 0.1);
  controls.update();
});

document.getElementById('btn-front').addEventListener('click', () => {
  const t = controls.target;
  camera.position.set(t.x, t.y + 5, t.z + 35);
  controls.update();
});

document.getElementById('btn-wire').addEventListener('click', function () {
  wireframeMode = !wireframeMode;
  this.classList.toggle('active', wireframeMode);
  for (const im of allInstancedMeshes) {
    im.material.wireframe = wireframeMode;
  }
});

document.getElementById('btn-legend').addEventListener('click', function () {
  const legend = document.getElementById('legend');
  const show = legend.style.display === 'none' || legend.style.display === '';
  legend.style.display = show ? 'block' : 'none';
  this.classList.toggle('active', show);
});

// ===================== 窗口缩放 =====================
window.addEventListener('resize', () => {
  camera.aspect = container.clientWidth / container.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(container.clientWidth, container.clientHeight);
});

// ===================== 渲染循环 =====================
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

// ===================== 键盘快捷键 =====================
window.addEventListener('keydown', (e) => {
  switch (e.key.toLowerCase()) {
    case 't': document.getElementById('btn-top').click(); break;
    case 'f': document.getElementById('btn-front').click(); break;
    case 'r': document.getElementById('btn-reset').click(); break;
    case 'w':
      wireframeMode = !wireframeMode;
      document.getElementById('btn-wire').classList.toggle('active', wireframeMode);
      for (const im of allInstancedMeshes) im.material.wireframe = wireframeMode;
      break;
    case 'l': document.getElementById('btn-legend').click(); break;
  }
});

// 暴露全局 API
window.loadBlocksFromURL = async function(url) {
  const loadingEl = document.getElementById('loading');
  loadingEl.classList.add('show');
  loadingEl.textContent = '⏳ 读取文件中...';
  try {
    const res = await fetch(url);
    const data = await res.json();
    const blocks = Array.isArray(data) ? data : (data.blocks || data.data || []);
    if (blocks.length === 0) throw new Error('未找到方块数据');
    renderBlocks(blocks);
  } catch (err) {
    alert('加载失败: ' + err.message);
    loadingEl.classList.remove('show');
  }
};

window.loadBlocksFromData = function(blocks) {
  renderBlocks(blocks);
};

// 自动检测同目录下的 blocks.json
(async () => {
  try {
    const res = await fetch('/blocks.json');
    if (res.ok) {
      const data = await res.json();
      const blocks = Array.isArray(data) ? data : (data.blocks || []);
      if (blocks.length > 0) {
        console.log('🔍 自动检测到 blocks.json (' + blocks.length + ' 个方块)，正在加载...');
        renderBlocks(blocks);
      }
    }
  } catch (e) {
    console.log('💡 未找到自动 blocks.json，请手动加载');
  }
})();

console.log('🏗️  MC AI Builder 3D Viewer 就绪');
console.log('   自动检测 blocks.json 或点击"加载"按钮');
console.log('   T=俯视 F=正面 R=重置 W=线框 L=图例');
</script>
</body>
</html>
