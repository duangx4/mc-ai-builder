<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>渲染分支测试 - MC AI Builder</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        h1 {
            color: #4CAF50;
            text-align: center;
        }
        .test-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .test-card {
            background: #2a2a2a;
            border: 2px solid #3a3a3a;
            border-radius: 8px;
            padding: 15px;
        }
        .test-card h3 {
            margin: 0 0 10px 0;
            color: #64B5F6;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .status {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
        }
        .status.pending { background: #FFA726; }
        .status.success { background: #66BB6A; }
        .status.error { background: #EF5350; }
        .block-list {
            list-style: none;
            padding: 0;
            margin: 10px 0;
        }
        .block-list li {
            padding: 5px 10px;
            margin: 3px 0;
            background: #1a1a1a;
            border-radius: 4px;
            font-size: 12px;
            font-family: 'Courier New', monospace;
        }
        .controls {
            text-align: center;
            margin: 30px 0;
        }
        .btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            margin: 0 10px;
        }
        .btn:hover {
            background: #45a049;
        }
        .btn:disabled {
            background: #666;
            cursor: not-allowed;
        }
        .stats {
            background: #2a2a2a;
            border: 2px solid #4CAF50;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
            text-align: center;
        }
        .stats h2 {
            margin: 0 0 15px 0;
            color: #4CAF50;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 15px;
        }
        .stat-item {
            background: #1a1a1a;
            padding: 15px;
            border-radius: 6px;
        }
        .stat-value {
            font-size: 32px;
            font-weight: bold;
            color: #64B5F6;
        }
        .stat-label {
            font-size: 14px;
            color: #999;
            margin-top: 5px;
        }
        .instructions {
            background: #2a2a2a;
            border-left: 4px solid #64B5F6;
            padding: 15px 20px;
            margin: 20px 0;
            border-radius: 4px;
        }
        .instructions h3 {
            margin-top: 0;
            color: #64B5F6;
        }
        .instructions code {
            background: #1a1a1a;
            padding: 2px 6px;
            border-radius: 3px;
            color: #4CAF50;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 VoxelWorld 渲染分支测试</h1>

        <div class="instructions">
            <h3>📋 使用说明</h3>
            <p><strong>前提条件：</strong></p>
            <ul>
                <li>确保前端已启动：<code>npm run dev</code> (http://localhost:5173)</li>
                <li>打开主应用并进入 3D 画布页面</li>
                <li>打开浏览器控制台（F12）</li>
            </ul>
            <p><strong>测试步骤：</strong></p>
            <ol>
                <li>点击下方"开始测试"按钮</li>
                <li>脚本将在主应用中自动添加各类方块</li>
                <li>观察 3D 画布中的渲染效果</li>
                <li>检查下方的测试结果统计</li>
            </ol>
        </div>

        <div class="controls">
            <button class="btn" id="startTest">🚀 开始测试</button>
            <button class="btn" id="clearBlocks" disabled>🗑️ 清空方块</button>
            <button class="btn" id="exportResults" disabled>📊 导出结果</button>
        </div>

        <div class="stats" id="stats" style="display:none;">
            <h2>📊 测试统计</h2>
            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-value" id="totalTypes">0</div>
                    <div class="stat-label">测试类型</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="totalBlocks">0</div>
                    <div class="stat-label">测试方块</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="successRate">0%</div>
                    <div class="stat-label">成功率</div>
                </div>
            </div>
        </div>

        <div class="test-grid" id="testGrid"></div>
    </div>

    <script>
        const TEST_BLOCKS = {
            // 新增的渲染分支
            RAIL: ['rail', 'powered_rail', 'detector_rail', 'activator_rail'],
            PRESSURE_PLATE: ['stone_pressure_plate', 'oak_pressure_plate', 'heavy_weighted_pressure_plate'],
            FENCE: ['oak_fence', 'spruce_fence', 'birch_fence'],
            WALL: ['cobblestone_wall', 'stone_brick_wall', 'brick_wall'],
            GLASS_PANE: ['glass_pane', 'white_stained_glass_pane', 'iron_bars'],
            DOOR: ['oak_door', 'iron_door', 'birch_door'],
            TRAPDOOR: ['oak_trapdoor', 'iron_trapdoor', 'spruce_trapdoor'],
            BARREL: ['barrel'],
            SCAFFOLDING: ['scaffolding'],

            // 原有的渲染分支
            STAIRS: ['oak_stairs', 'stone_stairs', 'polished_deepslate_stairs'],
            SLAB: ['oak_slab', 'stone_slab', 'smooth_stone_slab'],
            GLASS: ['glass', 'white_stained_glass', 'blue_stained_glass'],
            PLANT: ['poppy', 'dandelion', 'grass', 'fern'],
            CARPET: ['white_carpet', 'red_carpet', 'blue_carpet'],
            BUTTON: ['oak_button', 'stone_button'],
            REDSTONE: ['redstone_wire', 'redstone_torch'],

            // 临时实现的
            CHEST: ['chest', 'ender_chest'],
            BED: ['red_bed', 'white_bed'],
            FURNACE: ['furnace', 'blast_furnace'],
            LADDER: ['ladder'],
            WORKSTATION: ['crafting_table', 'anvil'],
            GLOWING: ['beacon', 'sea_lantern'],
            SPECIAL: ['hopper', 'piston']
        };

        let testResults = {};

        function createTestCards() {
            const grid = document.getElementById('testGrid');
            grid.innerHTML = '';

            for (const [type, blocks] of Object.entries(TEST_BLOCKS)) {
                const card = document.createElement('div');
                card.className = 'test-card';
                card.id = `card-${type}`;

                const blockList = blocks.map(b =>
                    `<li id="block-${b}"><span class="status pending"></span> ${b}</li>`
                ).join('');

                card.innerHTML = `
                    <h3>
                        <span class="status pending" id="status-${type}"></span>
                        ${type}
                    </h3>
                    <div>${blocks.length} 个方块</div>
                    <ul class="block-list">
                        ${blockList}
                    </ul>
                `;

                grid.appendChild(card);
            }
        }

        async function runTest() {
            console.log('🚀 开始渲染分支测试...');

            const startBtn = document.getElementById('startTest');
            const clearBtn = document.getElementById('clearBlocks');
            const exportBtn = document.getElementById('exportResults');
            const stats = document.getElementById('stats');

            startBtn.disabled = true;
            stats.style.display = 'block';

            testResults = {};
            let totalBlocks = 0;
            let successBlocks = 0;
            let typeIndex = 0;

            for (const [type, blocks] of Object.entries(TEST_BLOCKS)) {
                console.log(`\n📦 测试 ${type} (${blocks.length} 个方块)`);
                testResults[type] = { total: blocks.length, success: 0, failed: [] };

                for (let i = 0; i < blocks.length; i++) {
                    const blockType = blocks[i];
                    const x = i * 3;
                    const z = typeIndex * 3;

                    totalBlocks++;

                    try {
                        // 获取主窗口的 store
                        const mainWindow = window.opener || window;
                        const store = mainWindow.__voxel_store;

                        if (!store) {
                            throw new Error('无法访问主应用 store。请确保主应用已打开！');
                        }

                        const addBlock = store.getState().addBlock;
                        addBlock(blockType, [x, 0, z]);

                        // 标记成功
                        document.querySelector(`#block-${blockType} .status`).className = 'status success';
                        testResults[type].success++;
                        successBlocks++;
                        console.log(`  ✅ ${blockType} at (${x}, 0, ${z})`);

                    } catch (error) {
                        // 标记失败
                        document.querySelector(`#block-${blockType} .status`).className = 'status error';
                        testResults[type].failed.push(blockType);
                        console.error(`  ❌ ${blockType} - ${error.message}`);
                    }

                    await new Promise(resolve => setTimeout(resolve, 100));
                }

                // 更新类型状态
                const typeStatus = document.getElementById(`status-${type}`);
                if (testResults[type].success === testResults[type].total) {
                    typeStatus.className = 'status success';
                } else if (testResults[type].success > 0) {
                    typeStatus.className = 'status pending';
                } else {
                    typeStatus.className = 'status error';
                }

                typeIndex++;
            }

            // 更新统计
            document.getElementById('totalTypes').textContent = Object.keys(TEST_BLOCKS).length;
            document.getElementById('totalBlocks').textContent = totalBlocks;
            document.getElementById('successRate').textContent =
                ((successBlocks / totalBlocks) * 100).toFixed(1) + '%';

            console.log('\n✅ 测试完成！');
            console.log(`总计: ${successBlocks}/${totalBlocks} 方块成功添加`);

            clearBtn.disabled = false;
            exportBtn.disabled = false;
        }

        function clearAllBlocks() {
            try {
                const mainWindow = window.opener || window;
                const store = mainWindow.__voxel_store;

                if (!store) {
                    alert('无法访问主应用 store');
                    return;
                }

                store.getState().clearBlocks();
                console.log('🗑️ 已清空所有方块');
                alert('已清空所有方块');
            } catch (error) {
                console.error('清空失败:', error);
                alert('清空失败: ' + error.message);
            }
        }

        function exportResults() {
            const json = JSON.stringify(testResults, null, 2);
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'render-branch-test-results.json';
            a.click();
            URL.revokeObjectURL(url);
        }

        // 初始化
        createTestCards();

        document.getElementById('startTest').addEventListener('click', runTest);
        document.getElementById('clearBlocks').addEventListener('click', clearAllBlocks);
        document.getElementById('exportResults').addEventListener('click', exportResults);
    </script>
</body>
</html>
